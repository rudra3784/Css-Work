<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | Rudra Portfolio</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/b5abefa349.js" crossorigin="anonymous"></script>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">Rudra's Portfolio</div>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="project.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>


  <!-- CONTACT SECTION -->
  <section class="contact">
    <h2>Contact Me</h2>

    <p class="contact-intro">
      Have any question or project idea? Feel free to contact me 🙂
    </p>

    <div class="contact-grid">

      <!-- LEFT SIDE -->
      <div class="contact-info">

        <div class="info-item">
          <i class="fa-solid fa-envelope"></i>
          <span>rudra@example.com</span>
        </div>

        <div class="info-item">
          <i class="fa-solid fa-phone"></i>
          <span>+91 **********</span>
        </div>

        <div class="info-item">
          <i class="fa-solid fa-location-dot"></i>
          <span>Gandhinagar, Gujarat</span>
        </div>

      </div>

      <!-- RIGHT FORM -->
      <form class="contact-form">
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea rows="5" placeholder="Your Message"></textarea>

        <button type="submit">Send Message</button>
      </form>

    </div>

  </section>


  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 Rudra | Portfolio</p>

    <div class="social">
      <a href="#"><i class="fa-brands fa-github"></i></a>
      <a href="#"><i class="fa-brands fa-linkedin"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </footer>

</body>
</html>
